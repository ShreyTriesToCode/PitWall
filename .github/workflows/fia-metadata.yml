name: Refresh FIA metadata
on:
  schedule:
    - cron: "43 2 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pitwall-publisher
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh official metadata independently of forecast capture
        env:
          FIA_DOCUMENTS_ENABLED: "true"
          FIA_DOCUMENT_WAYBACK_ENABLED: "false"
          FIA_DOCUMENT_F1LIVEPULSE_ENABLED: "false"
          FIA_DOCUMENT_COMMUNITY_INDEX_ENABLED: "false"
          FIA_DOCUMENT_REGULATION_MIRROR_ENABLED: "false"
        run: python scripts/refresh_fia_metadata.py
      - name: Save metadata with provenance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data_cache/fia-documents/*/season_index.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh official FIA metadata"
            git pull --rebase origin "${{ github.ref_name }}"
            git push
          fi
