name: Publish PitWall data
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pitwall-publisher
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - uses: actions/cache@v4
        with:
          path: data_cache/provider
          key: pitwall-provider-${{ github.run_id }}
          restore-keys: pitwall-provider-
      - name: Validate before publication
        run: |
          ruff check f1_briefing.py pitwall scripts tests
          python -m pytest -q
      - name: Capture forecasts and compare published results
        run: python -m pitwall.publish
      - run: python scripts/validate_product.py
      - name: Commit small contract and immutable ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data_cache/product.json data_cache/evaluated-dataset.json
          git add data_cache/fia-documents/*/season_index.json
          if [ -d data_cache/ledger ]; then git add data_cache/ledger; fi
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish validated PitWall data"
            git pull --rebase origin "${{ github.ref_name }}"
          git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pitwall-publication
          path: |
            data_cache/product.json
            data_cache/ledger
          retention-days: 30
